[project]
name = "ttt-diffusion-adaptation"
version = "0.1.0"
description = "Adapting text2image diffusion models to sparse human feedback using test-time training."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.11.0",
    "diffusers>=0.30.0",
    "ipykernel>=7.1.0",
    "ipynb>=0.5.1",
    "matplotlib>=3.10.7",
    "safetensors>=0.6.2",
    "torch>=2.9.0",
    "transformers>=4.42.0",
]
